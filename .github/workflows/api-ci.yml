name: API CI

on:
  push:
    paths:
      - "apps/api/**"
      - ".github/workflows/api-ci.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - ".github/workflows/api-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-scaffold:
    name: Validate API scaffold
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check API manifests
        run: test -f apps/api/pyproject.toml && test -f apps/api/requirements.txt
